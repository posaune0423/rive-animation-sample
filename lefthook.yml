pre-commit:
  parallel: false
  jobs:
    - name: fmt
      # oxfmt rejects markdown, and a commit of only .md files would fail the whole hook
      glob: '*.{ts,tsx,js,mjs,json,css,yml}'
      run: bunx oxfmt {staged_files}
      stage_fixed: true
    - name: lint
      glob: '*.{ts,tsx}'
      run: bunx oxlint {staged_files}
    - name: typecheck
      run: bun run typecheck

pre-push:
  jobs:
    - name: test
      run: bun run test
